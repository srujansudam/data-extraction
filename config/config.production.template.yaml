app:
  name: data-extraction
  environment: production

database:
  type: sqlite
  path: data/internal_audit.db
  # Production uses SQLite SEE. The packaged application must use a SEE-enabled sqlite3.dll.
  encryption: see
  # INTERNAL_AUDIT_DB_KEY must return JSON like {"key": "long-random-passphrase"}.
  # Do not store the database key directly in config.yaml.
  secret_ref: INTERNAL_AUDIT_DB_KEY
  # Populate only if the SEE shared library build requires activation.
  see_activation_key: ""

secrets:
  provider: keepass # environment | keepass | keepass_cli

  keepass:
    # Local KeePass/KeePassXC database created on the client VM.
    database_path: secrets/internal_audit_secrets.kdbx

    # Recommended unattended unlock method. Restrict this file with NTFS ACLs.
    key_file_path: secrets/internal_audit_secrets.keyx

    # Leave blank unless client IT approves secure environment variable management.
    password_env_var: ""

  keepass_cli:
    # Fallback only. Prefer direct secrets.provider: keepass.
    executable_path: "powershell.exe"

    # The wrapper must return JSON. Keep {secret_ref}; the app replaces it at runtime.
    command_template: "-NoProfile -ExecutionPolicy Bypass -File \"C:\\InternalAuditDataExtraction\\scripts\\get_keepass_secret.ps1\" -SecretRef \"{secret_ref}\""

sources:
  orion:
    type: oracle
    enabled: true

    # KeePass entry title.
    # Secret must return:
    # username, password, host, port, service_name
    secret_ref: ORION_DB_PROD

  flexcube:
    type: oracle
    enabled: true

    # KeePass entry title.
    # Secret must return:
    # username, password, host, port, service_name
    secret_ref: FLEXCUBE_DB_PROD

  hris:
    type: dynamics365
    enabled: true

    # KeePass entry title.
    # Secret must return the Dynamics client secret in password/client_secret/secret/value.
    dynamics365:
      tenant_id: TO_BE_PROVIDED
      client_id: TO_BE_PROVIDED
      object_id: OPTIONAL_REFERENCE_ONLY
      secret_ref: HRIS_D365_PROD
      token_url: https://login.microsoftonline.com/{tenant_id}/oauth2/v2.0/token
      scope: https://operations-bovd365.api.crm4.dynamics.com/.default
      health_check_url: https://operations-bovd365.api.crm4.dynamics.com/api/data/v9.2/crfe9_hrisemployees?$top=1
      endpoints:
        hris_consolidated:
          url: https://operations-bovd365.api.crm4.dynamics.com/api/data/v9.2/crfe9_hrisemployees
          target_table: stg_hris_consolidated
          columns:
            hris_employee_id: crfe9_hrisemployeeid
            worker_personnel_number: crfe9_workerpersonnelnumber
            manager_personnel_number: crfe9_managerpersonnelnumber
            first_name: crfe9_firstname
            last_name: crfe9_lastname
            full_name: crfe9_name
            email: crfe9_identityemail
            identification_number: crfe9_identificationnumber
            worker_status: crfe9_workerstatus
            employment_start_date: crfe9_employmentstartdate
            employment_end_date: crfe9_employmentenddate
            is_primary_position: crfe9_isprimaryposition
            department: crfe9_department
            department_number: crfe9_departmentnumber
            section: crfe9_section
            subsection: crfe9_subsection
            chief_officer: crfe9_chiefofficer
            position_id: crfe9_positionid
            position_type: crfe9_positiontypeid
            position_description: crfe9_description
            parent_position_id: crfe9_parentpositionid
            parent_position_description: crfe9_parentpositiondescription
            manager_name: crfe9_managername
            manager_email: crfe9_manageremail
            manager_bovnt: crfe9_managerbovnt
            nt_username: crfe9_bovnt_custom
            created_on: createdon
            modified_on: modifiedon
            state_code: statecode
            status_code: statuscode

  lotus_notes:
    enabled: true

    # Current supported mode is excel.
    # Excel remains the default fallback. Enable CORBA only after VM validation.
    mode: excel # excel or corba

    # Legacy top-level ref retained for compatibility. CORBA uses corba.secret_ref.
    secret_ref: LOTUS_NOTES_PROD

    excel_input_folder: lotus_notes/incoming

    files:
      lotus_bov_employees: lotus_notes/incoming/bov_employees.xlsx
      lotus_legal_rulings: lotus_notes/incoming/legal_rulings.xlsx
      lotus_garnishee_orders: lotus_notes/incoming/garnishee_orders.xlsx
      lotus_poa_revocation: lotus_notes/incoming/poa_revocation.xlsx
      lotus_discrepancies_management: lotus_notes/incoming/discrepancies_management.xlsx

    corba:
      enabled: false
      java_command: java
      ior_file: config/diiop_ior.txt
      jar_path: java/lotus-corba-reader/lotus-corba-reader.jar
      notes_jar_path: java/lib/notes.jar
      ncso_jar_path: java/lib/ncso.jar
      output_folder: data/lotus_notes/corba_output
      secret_ref: LOTUS_NOTES_PROD
      extracts:
        bov_employees:
          server: Pinto/BOV
          database: BOV\BOVADMIN.NSF
          replica_id: C12562FA:003EC588
          view: (EY - Employees)
          columns:
            - user_name
            - obpm_no
            - fcubs_no
            - location
            - staff_no
        legal_rulings:
          server: Pinto/BOV
          database: BOV\LegalRulings.nsf
          replica_id: C1256E4B:002152FC
          view: (EY - LR)
          columns:
            - identity
            - ref_no
            - deceased_customer_code
            - deceased_customer
            - date_of_death
            - notary
            - notary_address
        garnishee_orders:
          server: Pinto/BOV
          database: BOV\Garnishee.nsf
          replica_id: C125688E:002A8BE6
          view: (EY - GO)
          columns:
            - debtor_name
            - identity
            - address
            - amount
            - vide
            - go_no
            - ref_no
            - date_issued
            - creditor_details
            - valid_to
            - judicial_letter
            - reply_to_jl
            - status
            - currency
        poa_revocation:
          server: Pinto/BOV
          database: BOV\POARevok.nsf
          replica_id: C1256D49:001CC46D
          view: (EY - POA)
          columns:
            - date_of_circulation
            - reference_no
            - instructions_received_from
            - given_by
            - id_pp_no_given_by
            - customer_code_given_by
            - given_to
            - details_of_poa
        discrepancies_management:
          server: Pinto/BOV
          database: BOV\DiscrepanciesEURO.nsf
          replica_id: C12572DC:002EE6B7
          view: (EY - DiscrÃ©pancies)
          columns:
            - date
            - amount
            - net_amount
            - classification
            - gravity
            - fraud_suspicion
            - authorisation

extraction:
  daily_mode: previous_day
  backfill_years: 2
  timezone: Europe/Malta

logging:
  level: INFO
  folder: logs
